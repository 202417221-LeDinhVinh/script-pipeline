pipeline_version: "0.1.0"
wpm: 185
word_count:
  target_min: 190
  target_max: 225
  hard_min: 185
  hard_max: 235
readability:
  flesch_kincaid_max: 6.5
  max_sentence_words: 20
hook:
  max_beat1_words: 20
slang:
  max_whitelist_hits: 3
models:
  writer:
    backend: opencode
    binary: opencode
    model_id: "opencode-go/muse-spark-1.3-contributor"
    timeout_seconds: 240
    temperature: 0.8
    max_tokens: 2000
    endpoint: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: "VSP_WRITER_API_KEY"
    price_input_per_1m: 0.10
    price_output_per_1m: 0.20
  judge:
    backend: opencode
    binary: opencode
    model_id: "opencode-go/deepseek-v4.1-flash"
    timeout_seconds: 240
    temperature: 0.0
    max_tokens: 1500
    endpoint: "https://api.deepseek.com/v1"
    api_key_env: "VSP_JUDGE_API_KEY"
    price_input_per_1m: 0.15
    price_output_per_1m: 0.60
opencode:
  max_total_tokens: 150000
  estimated_cost_usd_per_call: 0.002
word_equiv_factors:
  default: 1.0
  zh: 0.625
  ja: 0.625
  vi: 0.7
topology:
  single_shot_max_word_equiv: 3500
  confidence_threshold: 0.6
chunking:
  sliding_target: 6000
  sliding_min: 5000
  sliding_max: 7000
  clean_cut_window: 300
circuit_breakers:
  episode_limits:
    max_rewrite_attempts: 2
    max_total_tokens: 35000
    hard_cost_cap_usd: 0.05
    timeout_seconds: 900
  failure_handling_policy:
    if_standalone_or_ep1: "HARD_REJECT"
    if_mid_series_score_above_7: "FORCED_PASS_WITH_WARNING"
    if_mid_series_score_below_7: "COMPRESS_TO_STATE_AND_MERGE_NEXT_CHUNK"
  series_kill_switch:
    max_consecutive_failed_chunks: 2
    min_acceptable_series_avg_score: 6.5
    min_audited_chunks_for_avg: 3
    action_on_trigger: "BLACKLIST_NOVEL_SOURCE"
  global_daily_safety:
    max_daily_api_spend_usd: 5.00
audit:
  pass_threshold: 8.0
  rewrite_min_threshold: 5.0
  forced_pass_min: 7.0
state:
  compiled_budget_tokens: 600
default_market: "us"
default_language: "en"
