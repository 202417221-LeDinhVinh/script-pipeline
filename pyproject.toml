[project]
name = "viral-script-pipeline"
version = "0.1.0"
description = "Automated deterministic pipeline: raw texts -> 65-75s short-form video scripts"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "httpx>=0.25",
  "PyYAML>=6.0",
  "textstat>=0.7.4",
  "pytest>=8.0",
]

[project.scripts]
vsp = "vsp.cli:main"

[tool.pytest.ini_options]
markers = ["live: live LLM/network tests (skipped by default)"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
